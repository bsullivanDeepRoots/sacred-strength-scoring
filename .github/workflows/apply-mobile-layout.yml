name: Show friendly duplicate team message

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-mobile-layout.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update duplicate registration messages
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('That TEAM name already exists, but it could not be loaded. Contact the administrator.','TEAM Name Already Registered — This TEAM name has already been registered. If this is your TEAM, you do not need to register again. If you need to update your TEAM roster, please contact Brennen Sullivan.')
          s=s.replace('That TEAM already has a roster. Contact the administrator if you need to change it.','TEAM Name Already Registered — This TEAM name has already been registered. If this is your TEAM, you do not need to register again. If you need to update your TEAM roster, please contact Brennen Sullivan.')
          p.write_text(s)
          PY
          if ! git diff --quiet -- index.html; then
            git add index.html
            git commit -m "Show friendly duplicate team registration message"
            git push origin HEAD:main
          fi
