name: Show total teams on roster

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-mobile-layout.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add team total above men total
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='const totalMen=data.reduce((sum,r)=>sum+(Number(r.team_size)||0),0);\n    box.innerHTML=\'<div class="rosterTotal"><b>TOTAL MEN ON ROSTERS: \'+totalMen+\'</b></div>'
          new='const totalTeams=data.length;\n    const totalMen=data.reduce((sum,r)=>sum+(Number(r.team_size)||0),0);\n    box.innerHTML=\'<div class="rosterTotal"><b>TOTAL TEAMS ON ROSTER: \'+totalTeams+\'</b><br><b>TOTAL MEN ON ROSTERS: \'+totalMen+\'</b></div>'
          if old not in s:
              raise SystemExit('Roster total block not found; refusing unsafe edit')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          if ! git diff --quiet -- index.html; then
            git add index.html
            git commit -m "Show total teams on roster"
            git push origin HEAD:main
          fi
