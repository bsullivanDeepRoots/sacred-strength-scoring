name: Allow missing rosters to attach to existing teams

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-mobile-layout.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recover rosterless existing teams safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          start=s.find('$("#submitRoster").onclick=async()=>{')
          end=s.find('\nasync function rosterData()',start)
          if start < 0 or end < 0:
              raise SystemExit('Roster handler not found; refusing unsafe edit')
          old=s[start:end]
          new=old.replace('let {data:existing,error:findError}=await db.from("teams").select("id,name").eq("session_id",S.sid).eq("name",team_name).maybeSingle();if(findError)throw findError;if(!existing)throw new Error("TEAM Name Already Registered — This TEAM name has already been registered. If this is your TEAM, you do not need to register again. If you need to update your TEAM roster, please contact Brennen Sullivan.");team=existing','await teams();let existing=S.teams.find(t=>t.name.trim().replace(/\\s+/g," ").toLowerCase()===team_name.trim().replace(/\\s+/g," ").toLowerCase());if(!existing)throw new Error("TEAM Name Already Registered — This TEAM name has already been registered. If this is your TEAM, you do not need to register again. If you need to update your TEAM roster, please contact Brennen Sullivan.");team=existing')
          if new == old:
              raise SystemExit('Expected duplicate-team lookup not found; refusing unsafe edit')
          s=s[:start]+new+s[end:]
          p.write_text(s)
          PY
          if ! git diff --quiet -- index.html; then
            git add index.html
            git commit -m "Allow roster submission for existing rosterless teams"
            git push origin HEAD:main
          fi
