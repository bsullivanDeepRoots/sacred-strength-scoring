name: Back up team registration submissions

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-mobile-layout.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Save registration data before normal processing
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='$("#submitRoster").disabled=true;try{'
          replacement='$("#submitRoster").disabled=true;try{let {error:backupError}=await db.from("team_registration_backup").insert({session_id:S.sid,team_name,team_size,members});if(backupError)throw new Error("Your registration could not be safely saved. Please try again. "+backupError.message);'
          if marker not in s:
              raise SystemExit('Roster submission start not found; refusing unsafe edit')
          s=s.replace(marker,replacement,1)
          p.write_text(s)
          PY
          if ! git diff --quiet -- index.html; then
            git add index.html
            git commit -m "Back up registration before team roster processing"
            git push origin HEAD:main
          fi
