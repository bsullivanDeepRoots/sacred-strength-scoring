name: Do not block registration if backup fails

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-mobile-layout.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make registration backup non-blocking
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='let {error:backupError}=await db.from("team_registration_backup").insert({session_id:S.sid,team_name,team_size,members});if(backupError)throw new Error("Your registration could not be safely saved. Please try again. "+backupError.message);'
          new='let {error:backupError}=await db.from("team_registration_backup").insert({session_id:S.sid,team_name,team_size,members});if(backupError)console.error("Registration backup failed:",backupError);'
          if old not in s:
              raise SystemExit('Blocking backup logic not found; refusing unsafe edit')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          if ! git diff --quiet -- index.html; then
            git add index.html
            git commit -m "Make registration backup non-blocking"
            git push origin HEAD:main
          fi
