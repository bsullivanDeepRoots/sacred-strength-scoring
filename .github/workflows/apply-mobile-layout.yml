name: Fix team roster registration reliability

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-mobile-layout.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make roster registration recover existing rosterless teams
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          start=s.find('$("#submitRoster").onclick=async()=>{')
          end=s.find('\nasync function rosterData()',start)
          if start<0 or end<0:
              raise SystemExit('Roster submission handler not found; refusing unsafe edit')
          new=r'''$("#submitRoster").onclick=async()=>{let team_name=$("#newTeamName").value.trim(),team_size=+$("#rosterSize").value,names=$$(".memberName"),emails=$$(".memberEmailInput"),members=names.map((x,i)=>({name:x.value.trim(),email:emails[i].value.trim()}));$("#rosterSuccess").classList.remove("show");$("#rosterStatus").textContent="";if(!team_name)return $("#rosterStatus").textContent="Enter your TEAM name.";if(members.some(x=>!x.name||!x.email))return $("#rosterStatus").textContent="Enter a name and email for every TEAM member.";$("#submitRoster").disabled=true;try{let team=null,created=false;let {data:newTeam,error:teamError}=await db.from("teams").insert({session_id:S.sid,name:team_name}).select().single();if(!teamError){team=newTeam;created=true}else if(teamError.code==="23505"){let {data:existing,error:findError}=await db.from("teams").select("id,name").eq("session_id",S.sid).eq("name",team_name).maybeSingle();if(findError)throw findError;if(!existing)throw new Error("That TEAM name already exists, but it could not be loaded. Contact the administrator.");team=existing}else throw teamError;let {error:rosterError}=await db.from("team_rosters").insert({team_id:team.id,team_size,members});if(rosterError){if(created)await db.from("teams").delete().eq("id",team.id);if(rosterError.code==="23505")throw new Error("That TEAM already has a roster. Contact the administrator if you need to change it.");throw rosterError}$("#rosterSuccess").textContent="✓ TEAM name and roster submitted successfully.";$("#rosterSuccess").classList.add("show");$("#newTeamName").value="";$("#rosterSize").value="1";buildMemberFields();await teams();await render();if(await isAdmin())await renderAdmin()}catch(e){$("#rosterStatus").textContent="Could not submit TEAM roster: "+e.message}finally{$("#submitRoster").disabled=false}};'''
          s=s[:start]+new+s[end:]
          p.write_text(s)
          PY
          if ! git diff --quiet -- index.html; then
            git add index.html
            git commit -m "Make team roster registration reliable and recover rosterless teams"
            git push origin HEAD:main
          fi
