name: Number teams in Admin Manage Teams

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-mobile-layout.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add sequential numbers beside Manage Teams names
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='let th=S.teams.map(t=>\'<div class="row"><input id="tn\'+t.id+\'" value="\'+esc(t.name)+\'"><button data-rename="\'+t.id+\'">Save</button><button class="danger" data-delteam="\'+t.id+\'">Delete</button></div>\').join("");'
          new='let th=S.teams.map((t,i)=>\'<div class="row"><strong style="min-width:28px;text-align:right">\'+(i+1)+\'.</strong><input id="tn\'+t.id+\'" value="\'+esc(t.name)+\'"><button data-rename="\'+t.id+\'">Save</button><button class="danger" data-delteam="\'+t.id+\'">Delete</button></div>\').join("");'
          if old not in s:
              raise SystemExit('Manage Teams renderer not found; refusing unsafe edit')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          if ! git diff --quiet -- index.html; then
            git add index.html
            git commit -m "Number teams in Admin Manage Teams"
            git push origin HEAD:main
          fi
