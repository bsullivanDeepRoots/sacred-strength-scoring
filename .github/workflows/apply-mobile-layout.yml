name: Adjust scoring for one and two man teams

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-mobile-layout.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update score calculation only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='function calc(){let a=[];for(const x of $$(".s")){if(x.value==="")continue;let n=+x.value;if(!Number.isFinite(n)||n<0||n>40)return null;a.push(n)}if(!a.length)return null;return Math.round((a.reduce((x,y)=>x+y,0)/a.length*3)*100)/100}'
          new='function calc(){let a=[];for(const x of $$(".s")){if(x.value==="")continue;let n=+x.value;if(!Number.isFinite(n)||n<0||n>40)return null;a.push(n)}if(!a.length)return null;let sum=a.reduce((x,y)=>x+y,0);return Math.round((a.length<3?sum:(sum/a.length*3))*100)/100}'
          if old not in s:
              raise SystemExit('Exact scoring function not found; refusing unsafe edit')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          if ! git diff --quiet -- index.html; then
            git add index.html
            git commit -m "Score one and two man teams by raw total"
            git push origin HEAD:main
          fi
